<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>DG Putting Trainer</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --card-inner: rgba(255, 255, 255, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background-color: var(--card-bg);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      text-align: center;
    }

    .header h1 {
      font-size: 1.25rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .stat-card {
      background: var(--card-inner);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
    }

    .main-target {
      background: linear-gradient(135deg, #1e3a8a, #0284c7);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.1);
    }

    .target-label {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    .target-distance {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1.1;
      margin: 8px 0;
    }

    .prompt {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .btn-score {
      background-color: var(--card-inner);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      color: var(--text);
      font-size: 1.8rem;
      font-weight: 700;
      padding: 18px 0;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-score:active {
      transform: scale(0.95);
      background-color: var(--accent);
      border-color: var(--accent);
    }

    .btn-action {
      background: transparent;
      border: 1px solid var(--text-dim);
      color: var(--text-dim);
      border-radius: 12px;
      padding: 12px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .btn-action:active {
      background: var(--card-inner);
    }

    .summary-card {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .final-score {
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent);
    }

    /* HISTORIE */
    .history-section {
      margin-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 16px;
    }

    .history-title {
      font-size: 1rem;
      color: var(--text-dim);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 220px;
      overflow-y: auto;
    }

    .history-item {
      background: var(--card-inner);
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-date {
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .history-score {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- HERNÍ OBRAZOVKA -->
    <div id="game-screen">
      <div class="header">
        <h1>DG Putting Trainer</h1>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Kolo</div>
          <div class="stat-value"><span id="round-num">1</span>/20</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Celkové skóre</div>
          <div class="stat-value" id="total-score">0</div>
        </div>
      </div>

      <div class="main-target" style="margin: 20px 0;">
        <div class="target-label">Aktuální stanoviště</div>
        <div class="target-distance"><span id="distance">10</span> m</div>
      </div>

      <div class="prompt" style="margin-bottom: 12px;">Kolik disků jsi proměnil?</div>

      <div class="buttons-grid">
        <button class="btn-score" onclick="submitHit(0)">0</button>
        <button class="btn-score" onclick="submitHit(1)">1</button>
        <button class="btn-score" onclick="submitHit(2)">2</button>
        <button class="btn-score" onclick="submitHit(3)">3</button>
        <button class="btn-score" onclick="submitHit(4)">4</button>
        <button class="btn-score" onclick="submitHit(5)">5</button>
      </div>

      <div style="margin-top: 16px; display: flex; gap: 8px;">
        <button class="btn-action" onclick="resetGame()">Restartovat</button>
        <button class="btn-action" onclick="toggleHistory()">Historie</button>
      </div>
    </div>

    <!-- SOUHRNNÁ OBRAZOVKA -->
    <div id="summary-screen" class="summary-card hidden">
      <h2>Trénink dokončen! 🎉</h2>
      <div>
        <div class="stat-label">Tvoje konečné skóre</div>
        <div class="final-score" id="final-score-val">0</div>
      </div>
      <button class="btn-score" style="background-color: var(--accent); border: none; font-size: 1.2rem; padding: 14px 0;" onclick="resetGame()">Hrát znovu</button>
      <button class="btn-action" onclick="toggleHistory()">Zobrazit historii</button>
    </div>

    <!-- SEKCE HISTORIE -->
    <div id="history-screen" class="hidden">
      <div class="history-title">
        <span>Historie tréninků</span>
        <button onclick="clearHistory()" style="background:none; border:none; color: #ef4444; font-size: 0.8rem; cursor:pointer;">Vymazat vše</button>
      </div>

      <div class="history-list" id="history-container">
        <!-- Položky se generují dynamicky -->
      </div>

      <button class="btn-action" style="margin-top: 16px;" onclick="closeHistory()">Zpět</button>
    </div>
  </div>

  <script>
    let round = 1;
    let distance = 10;
    let score = 0;

    function updateUI() {
      document.getElementById('round-num').innerText = round;
      document.getElementById('total-score').innerText = score;
      document.getElementById('distance').innerText = distance;
    }

    function submitHit(hits) {
      if (round > 20) return;

      score += hits * distance;
      distance = hits + 5;
      round++;

      if (round > 20) {
        endGame();
      } else {
        updateUI();
      }
    }

    function endGame() {
      saveScore(score);
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('summary-screen').classList.remove('hidden');
      document.getElementById('final-score-val').innerText = score;
    }

    function resetGame() {
      round = 1;
      distance = 10;
      score = 0;
      updateUI();
      document.getElementById('summary-screen').classList.add('hidden');
      document.getElementById('history-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
    }

    /* --- LOGIKA HISTORIE --- */
    function saveScore(finalScore) {
      const history = JSON.parse(localStorage.getItem('dg_putting_history') || '[]');
      const now = new Date();
      const dateStr = now.toLocaleDateString('cs-CZ', { day: '2-digit', month: '2-digit' }) + ' ' + 
                      now.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' });

      history.unshift({ date: dateStr, score: finalScore });
      localStorage.setItem('dg_putting_history', JSON.stringify(history));
    }

    function loadHistoryUI() {
      const history = JSON.parse(localStorage.getItem('dg_putting_history') || '[]');
      const container = document.getElementById('history-container');

      if (history.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-dim); padding: 20px;">Zatím žádné odehrané tréninky.</div>';
        return;
      }

      container.innerHTML = history.map((item, index) => `
        <div class="history-item">
          <div>
            <div class="history-date">${item.date}</div>
            ${index === 0 ? '<span style="font-size:0.7rem; color: var(--accent);">Poslední</span>' : ''}
          </div>
          <div class="history-score">${item.score} b.</div>
        </div>
      `).join('');
    }

    function toggleHistory() {
      loadHistoryUI();
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('summary-screen').classList.add('hidden');
      document.getElementById('history-screen').classList.remove('hidden');
    }

    function closeHistory() {
      document.getElementById('history-screen').classList.add('hidden');
      if (round > 20) {
        document.getElementById('summary-screen').classList.remove('hidden');
      } else {
        document.getElementById('game-screen').classList.remove('hidden');
      }
    }

    function clearHistory() {
      if (confirm('Opravdu chceš smazat celou historii tréninků?')) {
        localStorage.removeItem('dg_putting_history');
        loadHistoryUI();
      }
    }
  </script>
</body>
</html>
