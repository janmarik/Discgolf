<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="icon" type="image/png" href="icon1.png">
  <title>DG Putting Trainer</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --text: #f8fafc;
      --text-dim: #94a3b8;
      --card-inner: rgba(255, 255, 255, 0.05);
      --success: #22c55e;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background-color: var(--card-bg);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .header {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .header-logo {
      width: 52px;
      height: 52px;
      object-fit: contain;
    }

    .header h1 {
      font-size: 1.25rem;
      color: var(--text-dim);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 10px;
    }

    .stat-card {
      background: var(--card-inner);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
    }

    .stat-label {
      font-size: 0.8rem;
      color: var(--text-dim);
      margin-bottom: 4px;
    }

    .stat-value {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent);
    }

    .main-target {
      background: linear-gradient(135deg, #1e3a8a, #0284c7);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      box-shadow: inset 0 2px 4px rgba(255, 255, 255, 0.1);
    }

    .target-label {
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.9;
    }

    .target-distance {
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1.1;
      margin: 8px 0;
    }

    .prompt {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 600;
    }

    .buttons-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .btn-score {
      background-color: var(--card-inner);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      color: var(--text);
      font-size: 1.8rem;
      font-weight: 700;
      padding: 18px 0;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .btn-score:active {
      transform: scale(0.95);
      background-color: var(--accent);
      border-color: var(--accent);
    }

    .btn-action {
      background: transparent;
      border: 1px solid var(--text-dim);
      color: var(--text-dim);
      border-radius: 12px;
      padding: 12px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
    }

    .btn-action:active {
      background: var(--card-inner);
    }

    .summary-card {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .final-score {
      font-size: 3rem;
      font-weight: 800;
      color: var(--accent);
    }

    /* HISTORIE & GRAFY */
    .history-section {
      margin-top: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 16px;
    }

    .history-title {
      font-size: 1rem;
      color: var(--text-dim);
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .charts-heading {
      font-size: 0.9rem;
      color: var(--accent);
      font-weight: 600;
      margin: 14px 0 8px 0;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .charts-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 16px;
    }

    .pie-card {
      background: var(--card-inner);
      border-radius: 14px;
      padding: 10px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .pie-title {
      font-size: 0.8rem;
      font-weight: 700;
      margin-bottom: 6px;
      color: var(--text);
    }

    .pie-chart-wrapper {
      position: relative;
      width: 58px;
      height: 58px;
    }

    .pie-chart-wrapper svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
      border-radius: 50%;
    }

    .pie-percentage {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 0.7rem;
      font-weight: 700;
      color: var(--text);
    }

    .pie-stats-detail {
      font-size: 0.65rem;
      color: var(--text-dim);
      margin-top: 6px;
    }

    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
    }

    .history-item {
      background: var(--card-inner);
      padding: 12px 16px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .history-date {
      font-size: 0.85rem;
      color: var(--text-dim);
    }

    .history-score {
      font-weight: 700;
      font-size: 1.1rem;
      color: var(--accent);
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- HERNÍ OBRAZOVKA -->
    <div id="game-screen">
      <div class="header">
        <img src="icon.png" alt="DG Logo" class="header-logo" onerror="this.style.display='none'">
        <h1>DG Putting Trainer</h1>
      </div>

      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-label">Kolo</div>
          <div class="stat-value"><span id="round-num">1</span>/20</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Celkové skóre</div>
          <div class="stat-value" id="total-score">0</div>
        </div>
      </div>

      <div class="main-target" style="margin: 20px 0;">
        <div class="target-label">Aktuální stanoviště</div>
        <div class="target-distance"><span id="distance">10</span> m</div>
      </div>

      <div class="prompt" style="margin-bottom: 12px;">Kolik disků jsi proměnil?</div>

      <div class="buttons-grid">
        <button class="btn-score" onclick="submitHit(0)">0</button>
        <button class="btn-score" onclick="submitHit(1)">1</button>
        <button class="btn-score" onclick="submitHit(2)">2</button>
        <button class="btn-score" onclick="submitHit(3)">3</button>
        <button class="btn-score" onclick="submitHit(4)">4</button>
        <button class="btn-score" onclick="submitHit(5)">5</button>
      </div>

      <div style="margin-top: 16px; display: flex; gap: 8px;">
        <button class="btn-action" onclick="resetGame()">Restartovat</button>
        <button class="btn-action" onclick="toggleHistory()">Historie</button>
      </div>
    </div>

    <!-- SOUHRNNÁ OBRAZOVKA -->
    <div id="summary-screen" class="summary-card hidden">
      <h2>Trénink dokončen! 🎉</h2>
      <div>
        <div class="stat-label">Tvoje konečné skóre</div>
        <div class="final-score" id="final-score-val">0</div>
      </div>
      <button class="btn-score" style="background-color: var(--accent); border: none; font-size: 1.2rem; padding: 14px 0;" onclick="resetGame()">Hrát znovu</button>
      <button class="btn-action" onclick="toggleHistory()">Zobrazit historii</button>
    </div>

    <!-- SEKCE HISTORIE -->
    <div id="history-screen" class="hidden">
      <div class="history-title">
        <span>Historie tréninků</span>
        <button onclick="clearHistory()" style="background:none; border:none; color: #ef4444; font-size: 0.8rem; cursor:pointer;">Vymazat vše</button>
      </div>

      <!-- KOLÁČOVÉ GRAFY PRO VZDÁLENOSTI -->
      <div class="charts-heading">Úspěšnost dle vzdáleností</div>
      <div class="charts-grid" id="charts-container">
        <!-- Dynamicky vkládané koláčové grafy -->
      </div>

      <div class="charts-heading">Aktivita</div>
      <div class="history-list" id="history-container">
        <!-- Položky se generují dynamicky -->
      </div>

      <button class="btn-action" style="margin-top: 16px;" onclick="closeHistory()">Zpět</button>
    </div>
  </div>

  <script>
    let round = 1;
    let distance = 10;
    let score = 0;
    let currentRoundHits = []; // Uchovává hody v probíhající hře

    function updateUI() {
      document.getElementById('round-num').innerText = round;
      document.getElementById('total-score').innerText = score;
      document.getElementById('distance').innerText = distance;
    }

    function submitHit(hits) {
      if (round > 20) return;

      currentRoundHits.push({ distance: distance, hits: hits, total: 5 });

      score += hits * distance;
      distance = hits + 5;
      round++;

      if (round > 20) {
        endGame();
      } else {
        updateUI();
      }
    }

    function endGame() {
      saveScore(score, currentRoundHits);
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('summary-screen').classList.remove('hidden');
      document.getElementById('final-score-val').innerText = score;
    }

    function resetGame() {
      round = 1;
      distance = 10;
      score = 0;
      currentRoundHits = [];
      updateUI();
      document.getElementById('summary-screen').classList.add('hidden');
      document.getElementById('history-screen').classList.add('hidden');
      document.getElementById('game-screen').classList.remove('hidden');
    }

    /* --- LOGIKA HISTORIE A STATISTIK --- */
    function saveScore(finalScore, roundData) {
      const history = JSON.parse(localStorage.getItem('dg_putting_history') || '[]');
      const now = new Date();
      const dateStr = now.toLocaleDateString('cs-CZ', { day: '2-digit', month: '2-digit' }) + ' ' + 
                      now.toLocaleTimeString('cs-CZ', { hour: '2-digit', minute: '2-digit' });

      history.unshift({ date: dateStr, score: finalScore, details: roundData });
      localStorage.setItem('dg_putting_history', JSON.stringify(history));
    }

    function generatePieSVG(percent) {
      const radius = 16;
      const circumference = 2 * Math.PI * radius; // cca 100.53
      const strokeDashoffset = circumference - (percent / 100) * circumference;

      return `
        <svg viewBox="0 0 40 40">
          <circle cx="20" cy="20" r="${radius}" fill="transparent" stroke="#ef4444" stroke-width="8" />
          <circle cx="20" cy="20" r="${radius}" fill="transparent" stroke="#22c55e" stroke-width="8"
            stroke-dasharray="${circumference}" stroke-dashoffset="${strokeDashoffset}" stroke-linecap="round" />
        </svg>
      `;
    }

    function loadHistoryUI() {
      const history = JSON.parse(localStorage.getItem('dg_putting_history') || '[]');
      const container = document.getElementById('history-container');
      const chartsContainer = document.getElementById('charts-container');

      // Vypočítat trefy a pokusy pro vzdálenosti 5m až 10m
      const distStats = {
        5: { hits: 0, total: 0 },
        6: { hits: 0, total: 0 },
        7: { hits: 0, total: 0 },
        8: { hits: 0, total: 0 },
        9: { hits: 0, total: 0 },
        10: { hits: 0, total: 0 }
      };

      history.forEach(game => {
        if (game.details && Array.isArray(game.details)) {
          game.details.forEach(item => {
            if (distStats[item.distance]) {
              distStats[item.distance].hits += item.hits;
              distStats[item.distance].total += item.total || 5;
            }
          });
        }
      });

      // Vykreslení koláčových grafů
      chartsContainer.innerHTML = '';
      for (let d = 5; d <= 10; d++) {
        const hits = distStats[d].hits;
        const total = distStats[d].total;
        const percent = total > 0 ? Math.round((hits / total) * 100) : 0;

        chartsContainer.innerHTML += `
          <div class="pie-card">
            <div class="pie-title">${d} m</div>
            <div class="pie-chart-wrapper">
              ${generatePieSVG(percent)}
              <div class="pie-percentage">${total > 0 ? percent + '%' : '-'}</div>
            </div>
            <div class="pie-stats-detail">${hits}/${total}</div>
          </div>
        `;
      }

      // Vykreslení seznamu odehraných tréninků
      if (history.length === 0) {
        container.innerHTML = '<div style="text-align: center; color: var(--text-dim); padding: 20px;">Zatím žádné odehrané tréninky.</div>';
        return;
      }

      container.innerHTML = history.map((item, index) => `
        <div class="history-item">
          <div>
            <div class="history-date">${item.date}</div>
            ${index === 0 ? '<span style="font-size:0.7rem; color: var(--accent);">Poslední</span>' : ''}
          </div>
          <div class="history-score">${item.score} b.</div>
        </div>
      `).join('');
    }

    function toggleHistory() {
      loadHistoryUI();
      document.getElementById('game-screen').classList.add('hidden');
      document.getElementById('summary-screen').classList.add('hidden');
      document.getElementById('history-screen').classList.remove('hidden');
    }

    function closeHistory() {
      document.getElementById('history-screen').classList.add('hidden');
      if (round > 20) {
        document.getElementById('summary-screen').classList.remove('hidden');
      } else {
        document.getElementById('game-screen').classList.remove('hidden');
      }
    }

    function clearHistory() {
      if (confirm('Opravdu chceš smazat celou historii tréninků a statistiky?')) {
        localStorage.removeItem('dg_putting_history');
        loadHistoryUI();
      }
    }
  </script>
</body>
</html>
